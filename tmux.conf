# Headless/SSH-safe tmux configuration.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:clipboard"
set -g set-clipboard on
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 200000
set -sg escape-time 1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Catppuccin Mocha with rounded chips (Powerline / Nerd Font glyphs).
# Palette: https://catppuccin.com/palette/
set -g status-position top
set -g status-interval 10
set -g status-justify centre
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 32
set -g status-right-length 44

# The session chip turns peach while the prefix is active.
set -g status-left " #[fg=#{?client_prefix,#fab387,#cba6f7},bg=#1e1e2e]#[fg=#1e1e2e,bg=#{?client_prefix,#fab387,#cba6f7},bold] #{=24:session_name} #[fg=#{?client_prefix,#fab387,#cba6f7},bg=#1e1e2e,nobold]#[default]  "
# Keep the directory chip out of the way on narrow terminals.
set -g @directory-chip "#[fg=#313244,bg=#1e1e2e]#[fg=#a6adc8,bg=#313244] #{=24:#{b:pane_current_path}} #[fg=#313244,bg=#1e1e2e]#[default] "
set -g status-right "#{?#{e|>=:#{client_width},100},#{E:@directory-chip},}#[fg=#89b4fa,bg=#1e1e2e]#[fg=#1e1e2e,bg=#89b4fa,bold] %H:%M #[fg=#89b4fa,bg=#1e1e2e,nobold]#[default] "

# Muted window chips; the selected window uses the mauve accent.
# Zoomed windows use soft rose, including when another window is selected.
set -g window-status-separator " "
set -g window-status-style "fg=#a6adc8,bg=#313244,none"
set -g window-status-format "#[fg=#{?window_zoomed_flag,#eba0ac,#313244},bg=#1e1e2e]#[default]#{?window_zoomed_flag,#[fg=#1e1e2e#,bg=#eba0ac],} #I  #{=24:window_name}#{?window_zoomed_flag, Z,} #[fg=#{?window_zoomed_flag,#eba0ac,#313244},bg=#1e1e2e]"
set -g window-status-current-style "fg=#1e1e2e,bg=#cba6f7,bold"
set -g window-status-current-format "#[fg=#{?window_zoomed_flag,#eba0ac,#cba6f7},bg=#1e1e2e,nobold]#[default]#[bg=#{?window_zoomed_flag,#eba0ac,#cba6f7}] #I  #{=24:window_name}#{?window_zoomed_flag, Z,} #[fg=#{?window_zoomed_flag,#eba0ac,#cba6f7},bg=#1e1e2e,nobold]"
set -g window-status-activity-style "fg=#f9e2af,bg=#313244"
set -g window-status-bell-style "fg=#f38ba8,bg=#313244,bold"

set -g pane-border-lines single
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cba6f7"
set -g mode-style "bg=#cba6f7,fg=#1e1e2e"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'aserowy/tmux.nvim'
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

if-shell 'test -x "$HOME/.local/share/tmux/plugins/tpm/tpm"' \
  'run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"' \
  'if-shell '\''test -x "$HOME/.config/tmux/plugins/tpm/tpm"'\'' '\''run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'\'''
